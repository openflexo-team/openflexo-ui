// The TokenMakers of the editors (FMLTokenMaker...) are Java files generated by JFlex from a .flex file; the generated Java is committed.
// See TOKENMAKERS.md. This is a manual task, not part of the build: ./gradlew :fml-technologyadapter-ui:generateTokenMakers
configurations {
  jflex
}

dependencies {
  // The version that RSyntaxTextArea and TokenMakerMaker use: the skeleton does not work with the later ones
  jflex 'de.jflex:jflex:1.4.1'
}

def jflexDirectory = file('src/main/resources/JFLEX')
def tokenMakerPackageDirectory = file('src/main/java/org/openflexo/fml/controller/view')

tasks.register('generateTokenMakers', JavaExec) {
  group = 'build'
  description = 'Generates the Java source of the TokenMakers from their .flex file and the skeleton, with JFlex 1.4.1.'
  classpath = configurations.jflex
  mainClass = 'JFlex.Main'
  args '--skel', new File(jflexDirectory, 'skeleton.default').absolutePath, '-d', tokenMakerPackageDirectory.absolutePath,
       new File(jflexDirectory, 'FMLTokenMaker.flex').absolutePath
  inputs.files(new File(jflexDirectory, 'FMLTokenMaker.flex'), new File(jflexDirectory, 'skeleton.default'))
  outputs.file(new File(tokenMakerPackageDirectory, 'FMLTokenMaker.java'))
  doLast {
    // JFlex keeps the previous version of a file it overwrites (Gradle ignores the files ending with ~ in a file tree)
    new File(tokenMakerPackageDirectory, 'FMLTokenMaker.java~').delete()
  }
}

